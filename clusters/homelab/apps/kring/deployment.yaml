apiVersion: apps/v1
kind: Deployment
metadata:
  name: kring
  labels: { app: kring }
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO-volume: oude pod eerst stoppen
  selector:
    matchLabels: { app: kring }
  template:
    metadata:
      labels: { app: kring }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      automountServiceAccountToken: false
      containers:
        - name: kring
          # De tag hieronder wordt door de pipeline van stoekadoe/kring bijgewerkt.
          image: ghcr.io/stoekadoe/kring:sha-3fd317f
          ports:
            - containerPort: 8080
              name: http
          env:
            - { name: DATA_DIR, value: /data }
          volumeMounts:
            - { name: data, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kring-data
